<ng-container #dynamicInputContainer>
</ng-container>

<!-- Buttons For Submit -->
<div class="form-group mt-2">
  <div class="row justify-content-between align-items-center">

    <!-- Botón Clear a la izquierda -->
    <div class="col-md-3">
      @if(!genericForm.customButton && genericForm.editAdd === 'Add') {
        <button type="button" class="btn btn-danger" (click)="clearForm()">Clear</button>
      }
    </div>

    <!-- Botones Add/Save y Delete a la derecha -->
    <div class="col-md-9 d-flex justify-content-end gap-2">
      @if(genericForm.customButton && genericForm.customButton != '') {
        <button type="submit" class="btn btn-primary" (click)="onSubmit()">
          {{ genericForm.customButton }}
        </button>
      }
      @else {
        <button type="submit" class="btn btn-primary" (click)="onSubmit()">
          {{ genericForm.editAdd !== 'Add' ? 'Save' : 'Add' }}
        </button>
      }

      @if(deletedEnabled == true) {
        <button type="button" class="btn btn-danger" (click)="delete()">Delete</button>
      }
    </div>

  </div>
</div>

<!-- Dialog for Update Confirmation -->
@if(maximizeUpdate && saveUpdate) {
  <p-dialog
    header="Cambiar Status"
    [(visible)]="maximizeUpdate"
    [modal]="true"
    [style]="{ width: '30vw' }"
    [maximizable]="maximizeUpdate"
    [draggable]="false"
    [resizable]="true"
  >
  
  </p-dialog>
}
